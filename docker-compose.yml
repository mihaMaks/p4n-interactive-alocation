services:
  app:
    build:
      context: .
      platforms:
        - linux/amd64
    image: maksmiha/p4ninteractive:latest
    environment:
      - PORT=5009
    expose:
      - "5009"
    volumes:
      - ./data:/app/data
      - ./meshes:/app/meshes
      
  nginx:
    image: nginx:alpine
    ports:
      - "5009:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/cert.pem:/etc/nginx/cert.pem
      - ./nginx/key.pem:/etc/nginx/key.pem
      - ./backend/static:/app/static
    depends_on:
      - app
